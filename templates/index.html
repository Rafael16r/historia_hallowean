<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b080e">
    <meta name="description"
          content="Create customized horror stories with the Nightmare Generator.">

    <title>Nightmare Generator | Create Your Own Nightmare</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="{{ url_for('static', filename='script.js') }}"
            defer></script>
</head>

<body>

  

    <main class="container">

        <section class="hero">
            <div class="moon" aria-hidden="true">🌕</div>

            <p class="eyebrow">YOUR IMAGINATION. YOUR NIGHTMARE.</p>

            <h1>Create a <br>
                <span>horror story</span>
            </h1>

           
        </section>

        <section class="generator">

            <div class="section-heading">
                <div>
                    <p class="section-label">01 / CUSTOMIZATION</p>
                    <h2>Build Your Own Nightmare</h2>
                </div>

                <span class="skull" aria-hidden="true">👻</span>
            </div>

            <form id="story-form">

                <div class="options-grid">

                    <div class="option">
                        <label for="local">📍 Where does it start?</label>

                        <select id="local" name="local">
                            <option value="casa">Abandoned House</option>
                            <option value="floresta">Dark Forest</option>
                            <option value="cemiterio">Ancient Cemetery</option>
                            <option value="hospital">Abandoned Hospital</option>
                            <option value="escola">Haunted School</option>
                        </select>
                    </div>

                    <div class="option">
                        <label for="monstro">👹 Who is chasing you?</label>

                        <select id="monstro" name="monstro">
                            <option value="vampiro">Vampire</option>
                            <option value="zombie">Zombie</option>
                            <option value="fantasma">Ghost</option>
                            <option value="lobisomem">Werewolf</option>
                            <option value="bruxa">Mysterious Witch</option>
                        </select>
                    </div>

                    <div class="option">
                        <label for="personagem">🕵️ Who are you?</label>

                        <select id="personagem" name="personagem">
                            <option value="estudante">Student</option>
                            <option value="detetive">Detective</option>
                            <option value="explorador">Explorer</option>
                            <option value="jornalista">Journalist</option>
                            <option value="cientista">Scientist</option>
                        </select>
                    </div>

                    <div class="option">
                        <label for="final">💀 How does it end?</label>

                        <select id="final" name="final">
                            <option value="assustador">Scary Ending</option>
                            <option value="feliz">Happy Ending</option>
                            <option value="inesperado">Unexpected Ending</option>
                            <option value="misterioso">Mysterious Ending</option>
                        </select>
                    </div>

                </div>

                <button class="primary-button" type="submit">
                    <span>🎃</span>
                    Create my story
                    <span class="button-arrow">→</span>
                </button>

               

            </form>
        </section>

        <section id="story" class="story" aria-live="polite" hidden>

            <div class="story-top">
                <div>
                    <p class="section-label">02 / YOUR DESTINY</p>
                    <h2>📖 Your Story</h2>
                </div>

                <span class="story-badge">STORY GENERATED</span>
            </div>

            <h3 id="story-title"></h3>

            <div id="story-text" class="story-text"></div>

            <div class="story-actions">
                <button id="copy-button" class="secondary-button"
                        type="button">
                    📋 Copy Story
                </button>

                <button id="again-button" class="secondary-button"
                        type="button">
                    🎲 Generate Another
                </button>
            </div>

            <p id="copy-status" class="copy-status" aria-live="polite"></p>

        </section>

        

    </main>

</body>
</html>
